<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f4f3f1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)">
    <title>Turnos de trabajo - Rota</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./vendor/design-system/design-system.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-text">
        <h1 id="title" class="app-header-title"></h1>
        <p id="subtitle" class="app-header-subtitle"></p>
      </div>
    </header>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text" class="toast-text"></span>
      <button id="toast-action" class="button strong" type="button" hidden></button>
    </div>

    <main>
      <section id="month" class="pane">
        <div class="pane-list">
          <div class="month-head">
            <button id="month-previous" class="button icon" type="button" data-i18n-attr="aria-label:month.previous"><svg class="icon" aria-hidden="true"><use href="icons.svg#chevron-left"/></svg></button>
            <h2 id="month-title" class="month-title"></h2>
            <button id="month-today" class="button accent" type="button" data-i18n="month.today"></button>
            <button id="month-next" class="button icon" type="button" data-i18n-attr="aria-label:month.next"><svg class="icon" aria-hidden="true"><use href="icons.svg#chevron-right"/></svg></button>
          </div>
          <div id="month-grid" class="month-grid"></div>
          <p id="month-empty" class="empty-state inline" data-i18n="month.noTypes"></p>
          <div id="month-totals" class="month-totals"></div>
        </div>
        <article id="day-detail" class="pane-detail">
          <p id="day-detail-empty" class="empty-state inline" data-i18n="month.pick"></p>
          <form id="day-detail-form" class="day" autocomplete="off">
            <h2 id="day-detail-title" class="day-title"></h2>
            <div id="day-detail-body"></div>
          </form>
        </article>
      </section>

      <section id="agenda" class="agenda" hidden>
        <p id="agenda-empty" class="empty-state inline" data-i18n="month.noTypes"></p>
        <ul id="agenda-list" class="agenda-list"></ul>
        <button id="agenda-more" class="button outline wide" type="button" data-i18n="agenda.more"></button>
      </section>

      <section id="plan" class="plan" hidden>
        <h2 class="plan-title" data-i18n="plan.types"></h2>
        <div id="type-list" class="list-group"></div>
        <div id="types-empty" class="empty-state">
          <p data-i18n="plan.noTypes"></p>
          <button id="types-add" class="button primary" type="button" data-i18n="plan.addType"></button>
        </div>
        <h2 class="plan-title" data-i18n="plan.cycles"></h2>
        <div id="cycle-list" class="list-group"></div>
      </section>

      <section id="settings" class="settings" hidden>
        <div id="account-group" hidden>
          <h2 class="list-group-head" data-i18n="settings.account"></h2>
          <div class="list-group">
            <div id="account-row" class="settings-row"><span id="account-email" class="settings-row-label"></span></div>
            <button id="logout" class="settings-row" type="button"><span class="settings-row-label" data-i18n="account.logout"></span><span class="chevron" aria-hidden="true">›</span></button>
            <button id="account-login" class="settings-row" type="button"><span class="settings-row-label" data-i18n="account.signIn"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.backup"></h2>
        <div class="list-group">
          <button id="export" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.export"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="import" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.import"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="reset" class="settings-row danger" type="button"><span class="settings-row-label" data-i18n="settings.reset"></span></button>
        </div>
        <h2 class="list-group-head" data-i18n="settings.preferences"></h2>
        <div class="list-group">
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.language"></span>
            <span id="language-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="language" class="select" data-i18n-attr="aria-label:settings.language"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.hand"></span>
            <span id="hand-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="hand" class="select" data-i18n-attr="aria-label:settings.hand"></select>
          </div>
          <div class="settings-row">
            <span class="settings-row-label" data-i18n="settings.theme"></span>
            <span id="theme-value" class="settings-row-value"></span>
            <span class="chevron" aria-hidden="true">›</span>
            <select id="theme" class="select" data-i18n-attr="aria-label:settings.theme"></select>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.modules"></h2>
        <div class="list-group">
          <label class="switch"><span data-i18n="nav.agenda"></span><input class="switch-input" type="checkbox" role="switch" data-module="agenda"></label>
        </div>
        <div id="install-group" hidden>
          <h2 class="list-group-head" data-i18n="settings.app"></h2>
          <div class="list-group">
            <button id="install" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.install"></span><span class="chevron" aria-hidden="true">›</span></button>
          </div>
        </div>
        <h2 class="list-group-head" data-i18n="settings.help"></h2>
        <div class="list-group">
          <button id="show-onboarding" class="settings-row" type="button"><span class="settings-row-label" data-i18n="settings.onboarding"></span><span class="chevron" aria-hidden="true">›</span></button>
          <button id="show-whatsnew" class="settings-row" type="button" hidden><span class="settings-row-label" data-i18n="settings.whatsNew"></span><span class="chevron" aria-hidden="true">›</span></button>
        </div>
        <footer class="about">
          <p class="about-line"><span id="version"></span><span id="version-status" class="version-status" role="status" data-status="checking"><svg data-for="checking" class="icon small" aria-hidden="true"><use href="icons.svg#refresh"/></svg><svg data-for="current" class="icon small" aria-hidden="true"><use href="icons.svg#check-circle"/></svg><svg data-for="outdated" class="icon small" aria-hidden="true"><use href="icons.svg#download"/></svg><svg data-for="unknown" class="icon small" aria-hidden="true"><use href="icons.svg#offline"/></svg><span id="version-status-text" class="version-status-text"></span></span></p>
          <button id="update" class="button accent" type="button" hidden><span data-i18n="settings.update"></span></button>
        </footer>
      </section>
    </main>

    <button id="fab" class="fab" type="button" data-i18n-attr="aria-label:plan.addType">+</button>

    <nav class="nav-bar" data-i18n-attr="aria-label:nav.label">
      <button class="nav-item" type="button" data-view="month">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#calendar"/></svg>
        <span data-i18n="nav.month"></span>
      </button>
      <button class="nav-item" type="button" data-view="agenda">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#agenda"/></svg>
        <span data-i18n="nav.agenda"></span>
      </button>
      <button class="nav-item" type="button" data-view="plan">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#cycle"/></svg>
        <span data-i18n="nav.plan"></span>
      </button>
      <button class="nav-item" type="button" data-view="settings">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#settings"/></svg>
        <span data-i18n="nav.settings"></span>
      </button>
    </nav>

    <div id="whatsnew-sheet" class="sheet-layer" hidden>
      <div id="whatsnew-veil" class="sheet-veil"></div>
      <section id="whatsnew" class="sheet" role="dialog" aria-modal="true" aria-labelledby="whatsnew-title">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="whatsnew-title" class="sheet-title main" data-i18n="whatsNew.title"></h2><button id="whatsnew-close" class="button tonal" type="button" data-i18n="whatsNew.close"></button></header>
        <div id="whatsnew-body" class="sheet-body whatsnew-body"></div>
      </section>
    </div>

    <div id="day-sheet" class="sheet-layer" hidden>
      <div id="day-veil" class="sheet-veil"></div>
      <form id="day-form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="day-sheet-title" autocomplete="off">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="day-sheet-title" class="sheet-title main wrap"></h2><button id="day-close" class="button icon" type="button" data-i18n-attr="aria-label:sheet.close"><svg class="icon" aria-hidden="true"><use href="icons.svg#close"/></svg></button></header>
        <div id="day-sheet-body" class="sheet-body"></div>
      </form>
    </div>

    <div id="type-sheet" class="sheet-layer" hidden>
      <div id="type-veil" class="sheet-veil"></div>
      <form id="type-form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="type-sheet-title" autocomplete="off">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="type-sheet-title" class="sheet-title main"></h2><button id="type-close" class="button icon" type="button" data-i18n-attr="aria-label:sheet.close"><svg class="icon" aria-hidden="true"><use href="icons.svg#close"/></svg></button></header>
        <div class="sheet-body">
          <label class="field"><input id="type-name" class="input field-input" type="text" maxlength="30" required data-i18n-attr="placeholder:type.name"><span class="field-label" data-i18n="type.name"></span></label>
          <label class="field"><input id="type-code" class="input field-input" type="text" maxlength="3" required data-i18n-attr="placeholder:type.code"><span class="field-label" data-i18n="type.code"></span></label>
          <h2 class="sheet-title part" data-i18n="type.kind"></h2>
          <div id="type-kind" class="segmented"></div>
          <div id="type-times" class="split">
            <label class="field"><input id="type-start" class="input field-input" type="time"><span class="field-label" data-i18n="type.start"></span></label>
            <label class="field"><input id="type-end" class="input field-input" type="time"><span class="field-label" data-i18n="type.end"></span></label>
          </div>
          <label id="type-break-field" class="field"><input id="type-break" class="input field-input" type="number" min="0" step="1" inputmode="numeric" data-i18n-attr="placeholder:type.break"><span class="field-label" data-i18n="type.break"></span></label>
          <h2 class="sheet-title part" data-i18n="type.color"></h2>
          <div id="type-colors" class="cluster"></div>
        </div>
        <footer class="sheet-foot">
          <button id="type-delete" class="button outline danger" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#trash"/></svg><span data-i18n="type.delete"></span></button>
          <button class="button primary" type="submit" data-i18n="type.save"></button>
        </footer>
      </form>
    </div>

    <div id="cycle-sheet" class="sheet-layer" hidden>
      <div id="cycle-veil" class="sheet-veil"></div>
      <form id="cycle-form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="cycle-sheet-title" autocomplete="off">
        <div class="sheet-grab"></div>
        <header class="sheet-head"><h2 id="cycle-sheet-title" class="sheet-title main"></h2><button id="cycle-close" class="button icon" type="button" data-i18n-attr="aria-label:sheet.close"><svg class="icon" aria-hidden="true"><use href="icons.svg#close"/></svg></button></header>
        <div class="sheet-body">
          <label class="field"><input id="cycle-from" class="input field-input" type="date" required><span class="field-label" data-i18n="cycle.start"></span></label>
          <h2 class="sheet-title part" data-i18n="cycle.steps"></h2>
          <div id="cycle-steps" class="cluster"></div>
          <p id="cycle-steps-empty" class="empty-state inline" data-i18n="cycle.noSteps"></p>
          <h2 class="sheet-title part" data-i18n="cycle.add"></h2>
          <div id="cycle-palette" class="cluster"></div>
          <h2 class="sheet-title part" data-i18n="cycle.preview"></h2>
          <div id="cycle-preview" class="cycle-preview"></div>
        </div>
        <footer class="sheet-foot">
          <button id="cycle-delete" class="button outline danger" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#trash"/></svg><span data-i18n="cycle.delete"></span></button>
          <button class="button primary" type="submit" data-i18n="cycle.save"></button>
        </footer>
      </form>
    </div>

    <div id="onboarding" class="onboarding" role="dialog" aria-modal="true" data-i18n-attr="aria-label:onboarding.label" hidden>
      <img class="onboarding-logo" src="./icons/logo.png" alt="">
      <div id="onboarding-page" class="onboarding-page">
        <div class="onboarding-art">
          <svg data-page="plan" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="40" y="40" width="160" height="80" rx="12"/>
            <rect class="art-solid" x="56" y="66" width="24" height="28" rx="6"/>
            <rect class="art-solid" x="88" y="66" width="24" height="28" rx="6"/>
            <path class="art-accent" d="M128 80h56"/>
            <path class="art-accent" d="M150 132a30 30 0 0 0 26-14M180 112l-4 8-8-2"/>
          </svg>
          <svg data-page="month" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="60" y="16" width="120" height="128" rx="12"/>
            <path class="art-accent" d="M60 44h120"/>
            <rect class="art-solid" x="76" y="56" width="18" height="18" rx="4"/>
            <rect class="art-solid" x="102" y="56" width="18" height="18" rx="4"/>
            <rect class="art-solid" x="128" y="84" width="18" height="18" rx="4"/>
            <rect class="art-solid" x="154" y="84" width="18" height="18" rx="4"/>
            <circle class="art-accent" cx="111" cy="121" r="10"/>
          </svg>
          <svg data-page="offline" viewBox="0 0 240 160" aria-hidden="true">
            <rect class="art-card" x="70" y="16" width="100" height="128" rx="12"/>
            <path class="art-accent" d="M96 70a34 34 0 0 1 48 0M106 82a20 20 0 0 1 28 0"/>
            <circle class="art-accent" cx="120" cy="96" r="4"/>
            <path d="M92 52l56 64"/>
          </svg>
        </div>
        <div aria-live="polite">
          <h2 id="onboarding-title" class="onboarding-title"></h2>
          <p id="onboarding-text" class="onboarding-text"></p>
        </div>
      </div>
      <div id="onboarding-dots" class="onboarding-dots" role="img"></div>
      <div class="onboarding-actions">
        <button id="onboarding-skip" class="button outline quiet" type="button" data-i18n="onboarding.skip"></button>
        <button id="onboarding-next" class="button primary" type="button"></button>
      </div>
    </div>

    <section id="auth" class="account" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden>
      <div id="login" class="account-page">
        <img class="account-logo" src="./icons/logo.png" alt="">
        <h2 id="login-title" class="account-title" tabindex="-1" data-i18n="account.login.title"></h2>
        <p class="account-text" data-i18n="account.login.text"></p>
        <button id="login-google" class="button tonal wide" type="button"><svg class="icon small" aria-hidden="true"><use href="icons.svg#google"/></svg><span data-i18n="account.google"></span></button>
        <p id="login-error" class="input-help danger" role="alert" hidden></p>
        <button id="login-offline" class="button accent" type="button" data-i18n="account.offline"></button>
      </div>
      <div id="waiting" class="account-page" hidden>
        <svg class="icon account-wait" aria-hidden="true"><use href="icons.svg#refresh"/></svg>
        <h2 id="waiting-title" class="account-title" tabindex="-1" data-i18n="account.waiting.title"></h2>
        <p class="account-text" data-i18n="account.waiting.text"></p>
        <button id="waiting-check" class="button tonal wide" type="button" data-i18n="account.waiting.check"></button>
        <button id="waiting-logout" class="button accent" type="button" data-i18n="account.logout"></button>
      </div>
    </section>

    <input id="import-file" type="file" accept="application/json,.json" hidden>

    <script type="importmap">
      {
        "imports": {
          "#app": "./src/app.js",
          "#config": "./src/config.js",
          "#pocketbase": "./src/pocketbase.js",
          "#session": "./src/session.js",
          "#dates": "./src/dates.js",
          "#shifts": "./src/shifts.js",
          "#totals": "./src/totals.js",
          "#install": "./src/install.js",
          "#sections": "./src/sections.js",
          "#modules": "./src/modules.js",
          "#storage": "./src/storage.js",
          "#version": "./src/version.js",
          "#whatsnew": "./src/whatsnew.js",
          "#i18n": "./src/i18n.js",
          "#locales/en": "./src/locales/en.js",
          "#locales/es": "./src/locales/es.js",
          "#ui/agenda": "./src/ui/agenda.js",
          "#ui/context": "./src/ui/context.js",
          "#ui/controls": "./src/ui/controls.js",
          "#ui/day": "./src/ui/day.js",
          "#ui/install": "./src/ui/install.js",
          "#ui/month": "./src/ui/month.js",
          "#ui/format": "./src/ui/format.js",
          "#ui/nav": "./src/ui/nav.js",
          "#ui/plan": "./src/ui/plan.js",
          "#ui/settings": "./src/ui/settings.js",
          "#particles": "./src/particles.js",
          "#onboarding": "./src/onboarding.js",
          "#ui/dust": "./src/ui/dust.js",
          "#ui/onboarding": "./src/ui/onboarding.js",
          "#ui/whatsnew": "./src/ui/whatsnew.js",
          "#ui/update": "./src/ui/update.js",
          "#ui/account": "./src/ui/account.js",
          "#ds/sheet": "./vendor/design-system/sheet.js"
        }
      }
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
